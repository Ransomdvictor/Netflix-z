name: Netflix-z CI

on:
  push:
    branches:
      - main
      - dev
      - stage

jobs:
  validate:
    name: Test and build application
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watchAll=false --ci

      - name: Build application
        run: npm run build

  docker:
    name: Build and push Docker image
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}

    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image tag output
        id: tag
        shell: bash
        run: echo "image_tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            devictor17/netflix-z:latest
            devictor17/netflix-z:${{ steps.tag.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-helm-chart:
    name: Update Helm chart image tag
    needs: docker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Helm chart repository
        uses: actions/checkout@v4
        with:
          repository: Ransomdvictor/Helmchart-Project
          ref: main
          token: ${{ secrets.HELM_REPO_PAT }}

      - name: Install yq
        shell: bash
        run: |
          wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O yq
          chmod +x yq
          sudo mv yq /usr/local/bin/yq

      - name: Update values.yaml with new image tag
        env:
          NEW_TAG: ${{ needs.docker.outputs.image_tag }}
        shell: bash
        run: |
          CHART_VALUES_FILE=""
          for candidate in values.yaml netflix-z/values.yaml chart/values.yaml; do
            if [ -f "$candidate" ]; then
              CHART_VALUES_FILE="$candidate"
              break
            fi
          done

          if [ -z "$CHART_VALUES_FILE" ]; then
            echo "Could not find values.yaml in the chart repository."
            find . -maxdepth 3 -name values.yaml -print
            exit 1
          fi

          yq -i '.image.repository = "devictor17/netflix-z" | .image.tag = strenv(NEW_TAG)' "$CHART_VALUES_FILE"

          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add "$CHART_VALUES_FILE"

          if git diff --cached --quiet; then
            echo "No chart change detected. Skipping commit."
            exit 0
          fi

          git commit -m "Update Netflix image tag to $NEW_TAG"
          git push